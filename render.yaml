services:
  - type: web
    name: gitvault
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: GITEA__server__HTTP_PORT
        value: 3000
      - key: GITEA__server__DOMAIN
        sync: false
      - key: GITEA__server__ROOT_URL
        sync: false
      - key: GITEA__database__DB_TYPE
        value: postgres
      - key: GITEA__database__HOST
        sync: false
      - key: GITEA__database__NAME
        value: postgres
      - key: GITEA__database__USER
        sync: false
      - key: GITEA__database__PASSWD
        sync: false
      - key: GITEA__database__SSL_MODE
        value: require
      - key: GITEA__storage__STORAGE_TYPE
        value: minio
      - key: GITEA__storage__MINIO_ENDPOINT
        value: s3.huggingface.co
      - key: GITEA__storage__MINIO_ACCESS_KEY_ID
        sync: false
      - key: GITEA__storage__MINIO_SECRET_ACCESS_KEY
        sync: false
      - key: GITEA__storage__MINIO_BUCKET
        sync: false
      - key: GITEA__storage__MINIO_LOCATION
        value: us-east-1
      - key: GITEA__storage__MINIO_USE_SSL
        value: "true"
      - key: KEEP_ALIVE_URL
        sync: false
